<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica', sans-serif; color: #333; }
        h1 { color: #84cc16; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; font-size: 12px; }
        th { background-color: #f8fafc; font-weight: bold; text-transform: uppercase; }
        .footer { margin-top: 30px; font-size: 10px; color: #666; text-align: center; }
    </style>
</head>
<body>
    <h1>Welfare Disbursement Report</h1>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Beneficiary</th>
                <th>Purpose</th>
                <th>Amount</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for item in donations %}
            <tr>
                <td>{{ item.created_at|date:"Y-m-d" }}</td>
                <td>{{ item.user.username }}</td>
                <td>{{ item.purpose }}</td>
                <td>₦{{ item.amount }}</td>
                <td>{{ item.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="footer">
        Generated by Ishrakaat Admin System on {% now "Y-m-d H:i" %}
    </div>
</body>
</html>
